name: relay

# Cloudflare Worker (worker/) が 15 分ごとに dispatch する。起こされたら監視 workflow を
# 固定の引数で dispatch する (omochairo/amazon-home-ops#84)。
#
# **inputs を足さないこと。** Worker 側の PAT が漏れても、この workflow を固定の動作で
# 回されるだけで済むのは入力が無いから。入力を取ると、それを経由して監視先 repo を
# 任意の入力で dispatch させる道ができる (監視先の workflow が入力をシェルへ直接
# 展開していれば、そこから secrets を抜かれる。README の「なぜ中継を挟むか」)。

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch monitors
        env:
          # fine-grained PAT: repo = amazon, amazon-home-ops / Actions: Read and write のみ
          GH_TOKEN: ${{ secrets.MONITOR_DISPATCH_PAT }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::MONITOR_DISPATCH_PAT が未設定"
            exit 1
          fi
          # repo  workflow  最小間隔 (分。0 = 毎回起こす)
          #   90-heartbeat-check  自宅ワーカーの dead-man's switch。**約 12 時間毎に間引く** (schedule が本線)
          #   53-origin-failover  navi のオリジン障害で待機系へ倒す (入力なし = 判定して倒す)
          #
          # 90-heartbeat-check を間引く理由: amazon-home-ops は private なので、GitHub ホスト
          # runner の分数を消費する。run は数秒で終わるが 1 分に切り上げて数えられるため、
          # 15 分毎に起こすとそれだけで月の無料枠を超える。判定を Actions の外へ移すまでの
          # 応急処置として、前回の run (監視先の schedule で起きた分も含む) から最小間隔が
          # 経っていなければ起こさない。監視先の schedule も 12 時間毎にしてあるので、
          # 普段は schedule が起こし、この中継は schedule が落ちたときの予備になる。
          # 毎回直近の beat (STALE_WINDOW) を見て判定する作りなので、間隔を伸ばしても
          # 判定は変わらず、検知が遅れるだけ。
          # 起動時刻の分で判定しないのは、relay 自体の起動遅延で取りこぼしや二重起動が起きるため。
          # 780 分 (= 13 時間) にしているのは、schedule (12 時間毎) より先に起こして二重に
          # 走らせないため。720 分ちょうどだと、schedule の発火の遅れの間に中継が先回りする。
          # schedule が 1 時間以上来なかったときだけ、中継が代わりに起こす。
          # 前回の run が読めないときは起こす (監視を止める側に倒さない)。
          #
          # **一時停止**: 最小間隔を持つ対象は、監視先の workflow が無効 (disabled_*) なら起こさない。
          # 分数に余裕が無い月は `gh workflow disable` で止め、余裕が出たら `enable` するだけで
          # 再開できる (この repo の変更は要らない。止めている間も relay は赤にならない)。
          # 状態が読めないときは起こす側に倒す。
          # 53-origin-failover は public の amazon で分数がかからないので 15 分毎のまま、一時停止の
          # 対象にもしない (誤って無効化されたら dispatch が失敗して relay が赤になる方がよい)。
          TARGETS='omochairo/amazon-home-ops 90-heartbeat-check.yml 780
          omochairo/amazon 53-origin-failover.yml 0'
          now="$(date -u +%s)"
          failed=0
          while read -r repo wf min_gap; do
            [ -n "${repo}" ] || continue
            if [ "${min_gap}" -gt 0 ]; then
              state="$(gh api "repos/${repo}/actions/workflows/${wf}" --jq '.state // empty' 2>/dev/null || true)"
              if [[ "${state}" == disabled* ]]; then
                echo "skip ${wf}: 監視先の workflow が ${state} (一時停止中)"
                continue
              fi
              last="$(gh api "repos/${repo}/actions/workflows/${wf}/runs?per_page=1"                 --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)"
              # 読めない値で $(( )) が構文エラーになると、ここでスクリプトごと終わって
              # 後続の監視も起こせなくなる。数値にできなければ起こす側に倒す。
              last_s="$(date -u -d "${last:-invalid}" +%s 2>/dev/null || true)"
              if [[ "${last_s}" =~ ^[0-9]+$ ]]; then
                age=$(( (now - last_s) / 60 ))
                if [ "${age}" -lt "${min_gap}" ]; then
                  echo "skip ${wf}: 前回の run から ${age} 分 (< ${min_gap} 分)"
                  continue
                fi
              fi
            fi
            if gh api --method POST "repos/${repo}/actions/workflows/${wf}/dispatches" -f ref=main >/dev/null; then
              echo "dispatched ${wf}"
            else
              echo "::error::dispatch failed: ${wf}"
              failed=1
            fi
          done <<< "${TARGETS}"
          exit "${failed}"
